services:
  postgres:
    image: postgres:16-alpine
    container_name: selfgotchi-postgres
    environment:
      POSTGRES_DB: selfgotchi
      POSTGRES_USER: selfgotchi
      POSTGRES_PASSWORD: selfgotchi
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfgotchi -d selfgotchi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
