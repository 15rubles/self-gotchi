spring:
  application:
    name: self-gotchi
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/selfgotchi}
    username: ${DB_USER:selfgotchi}
    password: ${DB_PASSWORD:selfgotchi}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

app:
  auth:
    # Single hardcoded account for the personal phase. The login name is the user's email.
    # Override both in any real deployment.
    username: ${APP_USERNAME:aleksei@selfgotchi.local}
    password: ${APP_PASSWORD:changeme}
  user:
    display-name: ${APP_USER_DISPLAY_NAME:Aleksei}
    # IANA zone, e.g. Europe/Berlin. Empty = the JVM's default zone when the user is first created.
    timezone: ${APP_USER_TIMEZONE:}
    # Hour (0-23) a new day starts. Empty = keep the stored value (04:00 for a new user).
    day-reset-hour: ${APP_DAY_RESET_HOUR:}
  seed:
    enabled: ${APP_SEED:true}
