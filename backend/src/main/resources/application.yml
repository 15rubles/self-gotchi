spring:
  servlet:
    multipart:
      # calendar .ics files (5 MB) and avatar photos (10 MB); each endpoint checks its own limit
      max-file-size: 11MB
      max-request-size: 11MB
  application:
    name: self-gotchi
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/selfgotchi}
    username: ${DB_USER:selfgotchi}
    password: ${DB_PASSWORD:selfgotchi}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      # Serves the built frontend (cd frontend && npm run build) at the same origin as the API,
      # which the installed PWA needs. Relative to the backend/ working directory.
      static-locations: ${STATIC_DIR:file:../frontend/dist/},classpath:/static/

server:
  port: ${PORT:8080}

app:
  auth:
    # Single hardcoded account for the personal phase. The login name is the user's email.
    # Override both in any real deployment.
    username: ${APP_USERNAME:aleksei@selfgotchi.local}
    password: ${APP_PASSWORD:changeme}
  user:
    display-name: ${APP_USER_DISPLAY_NAME:Aleksei}
    # IANA zone, e.g. Europe/Berlin. Empty = the JVM's default zone when the user is first created.
    timezone: ${APP_USER_TIMEZONE:}
    # Hour (0-23) a new day starts, for a new user only (later: Settings). Empty = 04:00.
    day-reset-hour: ${APP_DAY_RESET_HOUR:}
  seed:
    enabled: ${APP_SEED:true}
  avatar:
    # Uploaded photos (deleted once the avatar is done) and drawn frames. Relative to backend/.
    storage-dir: ${AVATAR_STORAGE_DIR:./data/avatars}
    openai:
      # Settings -> Character sends your photo to OpenAI. Empty key = the feature is off.
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_IMAGE_MODEL:gpt-image-2.5-flare}
      quality: ${OPENAI_IMAGE_QUALITY:medium}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
